<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quiz de culture générale</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="carte">
    <!-- Écran d'accueil -->
    <section id="ecran-accueil" class="ecran actif">
      <h1>Quiz de culture générale</h1>
      <p class="sous-titre">Histoire, géographie, sciences, arts, sport… Testez vos connaissances !</p>

      <label for="choix-categorie">Catégorie</label>
      <select id="choix-categorie"></select>

      <label for="choix-niveau">Difficulté</label>
      <select id="choix-niveau">
        <option value="">Tous niveaux</option>
        <option value="1">⭐ Facile</option>
        <option value="2">⭐⭐ Moyen</option>
        <option value="3">⭐⭐⭐ Difficile</option>
      </select>

      <label for="choix-nombre">Nombre de questions</label>
      <select id="choix-nombre">
        <option value="5">5</option>
        <option value="10" selected>10</option>
        <option value="20">20</option>
      </select>

      <label class="case">
        <input type="checkbox" id="choix-chrono" checked>
        Chronomètre (20 secondes par question)
      </label>

      <label class="case">
        <input type="checkbox" id="choix-son" checked>
        Effets sonores
      </label>

      <p id="info-disponibles" class="info"></p>

      <p id="record-accueil" class="record-accueil"></p>

      <button id="btn-commencer" class="btn principal">Commencer</button>
      <button id="btn-classement" class="btn secondaire">🏆 Classement et records</button>
    </section>

    <!-- Écran de question -->
    <section id="ecran-question" class="ecran">
      <div class="entete">
        <span id="progression"></span>
        <span id="score-courant"></span>
      </div>
      <div class="barre"><div id="barre-progression"></div></div>
      <div id="chrono" class="chrono"></div>
      <div class="badges">
        <span id="categorie-question" class="badge"></span>
        <span id="niveau-question" class="badge niveau"></span>
      </div>
      <h2 id="intitule"></h2>
      <div id="reponses" class="reponses"></div>
      <p id="explication" class="explication"></p>
      <button id="btn-suivant" class="btn principal cache">Question suivante</button>
    </section>

    <!-- Écran de résultats -->
    <section id="ecran-resultat" class="ecran">
      <h1>Résultats</h1>
      <p id="score-final" class="score-final"></p>
      <p id="message-final"></p>
      <p id="message-record" class="message-record"></p>
      <ul id="recapitulatif" class="recap"></ul>
      <button id="btn-rejouer" class="btn principal">Rejouer</button>
      <button id="btn-voir-classement" class="btn secondaire">🏆 Voir le classement</button>
    </section>

    <!-- Écran du classement -->
    <section id="ecran-classement" class="ecran">
      <h1>Classement</h1>
      <div class="filtres">
        <select id="cl-categorie" aria-label="Catégorie du classement"></select>
        <select id="cl-niveau" aria-label="Niveau du classement">
          <option value="">Tous niveaux</option>
          <option value="1">⭐ Facile</option>
          <option value="2">⭐⭐ Moyen</option>
          <option value="3">⭐⭐⭐ Difficile</option>
        </select>
      </div>
      <p id="cl-etat" class="info"></p>
      <ol id="cl-liste" class="classement"></ol>
      <p class="info">Classement au pourcentage de bonnes réponses, puis au nombre de questions.</p>

      <h2>Mes records</h2>
      <div class="tableau-records">
        <table id="mes-records">
          <thead>
            <tr><th>Catégorie</th><th>Tous</th><th>⭐</th><th>⭐⭐</th><th>⭐⭐⭐</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>

      <button id="btn-retour" class="btn principal">Retour à l'accueil</button>
    </section>
  </main>

  <script src="questions.js"></script>
  <script src="effets.js"></script>
  <script src="classement.js"></script>
  <script src="quiz.js"></script>
</body>
</html>
